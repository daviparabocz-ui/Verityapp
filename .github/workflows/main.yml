name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract full.zip
        run: |
          if [ ! -f "full.zip" ]; then
            echo "full.zip não encontrado na raiz do repositório."
            exit 1
          fi
          unzip -o full.zip -d .

      - name: Extract upd.zip (se existir)
        run: |
          if [ -f "upd.zip" ]; then
            echo "upd.zip encontrado, aplicando por cima do projeto..."
            unzip -o upd.zip -d .
          else
            echo "upd.zip não encontrado, seguindo só com full.zip."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build debug APK
        run:
